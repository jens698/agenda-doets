<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f6a52" />
  <title>Werkagenda</title>
  <style>
/* ===========================================================
   Werkagenda — zakelijk & warm, licht, diep groen accent
   =========================================================== */
:root {
  --bg:          #f6f3ec;
  --surface:     #ffffff;
  --surface-2:   #f1ece2;
  --border:      #e5dfd2;
  --border-2:    #d9d2c4;
  --text:        #20201c;
  --text-2:      #56524a;
  --muted:       #938d80;
  --accent:      #2f6a52;
  --accent-deep: #244f3e;
  --accent-soft: #e7efe9;
  --accent-line: #c5d8cd;
  --danger:      #a8443a;
  --danger-soft: #f4e4e1;
  --warn:        #9a7430;
  --warn-soft:   #f3ebda;
  --shadow-sm:   0 1px 2px rgba(33, 30, 22, .05);
  --shadow:      0 8px 28px rgba(33, 30, 22, .07);
  --radius:      14px;
  --radius-sm:   9px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  height: 100vh;
  overflow: hidden;
}

.icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.icon-sm { width: 15px; height: 15px; }

#app { display: grid; grid-template-columns: 256px 1fr; height: 100vh; }

/* ---------------- Sidebar ---------------- */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 22px 16px; gap: 26px; overflow-y: auto;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand h1 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.brand .date { font-size: 12.5px; color: var(--muted); text-transform: capitalize; }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-btn {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 10px; border: none; background: transparent;
  border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
  color: var(--text-2); cursor: pointer; text-align: left;
  transition: background .14s, color .14s; width: 100%;
}
.nav-btn:hover { background: var(--surface-2); color: var(--text); }
.nav-btn.active { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
.nav-btn .icon { color: var(--muted); }
.nav-btn.active .icon { color: var(--accent); }
.nav-btn .count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-btn.active .count { color: var(--accent); }

.side-heading {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .07em; color: var(--muted); padding: 0 10px; margin-bottom: 9px;
}
.cat-list { list-style: none; display: flex; flex-direction: column; gap: 1px; }
.cat-list li {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-radius: var(--radius-sm); font-size: 13.5px; color: var(--text-2);
  cursor: pointer; transition: background .14s;
}
.cat-list li:hover { background: var(--surface-2); }
.cat-list li.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
.cat-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
.cat-count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.sidebar-spacer { flex: 1; }
.side-action {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 9px 10px; border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; color: var(--text-2);
  cursor: pointer; transition: background .14s, border-color .14s;
}
.side-action:hover { background: var(--surface-2); border-color: var(--border-2); }
.side-action .icon { color: var(--muted); }
.side-action.on { color: var(--accent-deep); border-color: var(--accent-line); background: var(--accent-soft); }
.side-action.on .icon { color: var(--accent); }

/* ---------------- Main ---------------- */
.main { display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 26px 34px 20px; gap: 18px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.topbar h2 { font-size: 23px; font-weight: 650; letter-spacing: -.02em; }
.topbar .sub { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }

.search {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 11px;
  transition: border-color .14s;
}
.search:focus-within { border-color: var(--accent-line); }
.search .icon { color: var(--muted); }
.search input {
  border: none; background: transparent; outline: none; padding: 8px 0;
  font-size: 13.5px; color: var(--text); width: 170px; font-family: var(--font);
}

.btn {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font-family: var(--font); font-size: 13.5px; font-weight: 600;
  border-radius: var(--radius-sm); padding: 9px 15px; border: 1px solid transparent;
  transition: background .14s, border-color .14s, transform .08s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-deep); }
.btn-ghost { background: var(--surface); color: var(--text-2); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--border-2); }
.btn .icon { width: 16px; height: 16px; }

.icon-btn {
  display: grid; place-items: center; background: transparent; border: none;
  cursor: pointer; color: var(--muted); padding: 7px; border-radius: 8px;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

/* ---------------- Summary strip ---------------- */
.summary { display: flex; gap: 28px; padding: 16px 34px; border-bottom: 1px solid var(--border); }
.summary .item { display: flex; flex-direction: column; gap: 2px; }
.summary .num { font-size: 21px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.summary .lbl { font-size: 12px; color: var(--muted); }
.summary .num.accent { color: var(--accent); }
.summary .num.danger { color: var(--danger); }

/* ---------------- Content ---------------- */
.content { flex: 1; overflow-y: auto; padding: 8px 34px 48px; }

/* List view */
.group-title {
  font-size: 12px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; margin: 26px 2px 10px;
}
.group-title:first-child { margin-top: 18px; }

.task {
  display: flex; align-items: flex-start; gap: 13px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
  box-shadow: var(--shadow-sm); transition: border-color .14s, box-shadow .14s;
}
.task:hover { border-color: var(--border-2); box-shadow: var(--shadow); }
.task.done { background: var(--surface-2); }
.task.done .task-title { text-decoration: line-through; color: var(--muted); }

.check {
  width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid var(--border-2);
  flex-shrink: 0; margin-top: 1px; cursor: pointer; display: grid; place-items: center;
  color: transparent; transition: all .14s; background: var(--surface);
}
.check:hover { border-color: var(--accent); }
.check.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
.check .icon { width: 12px; height: 12px; stroke-width: 2.4; }

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 14.5px; font-weight: 550; letter-spacing: -.005em; }
.task-notes { font-size: 13px; color: var(--text-2); margin-top: 3px; line-height: 1.45; word-break: break-word; }
.task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 9px; }
.meta-bit { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 500; }
.meta-bit .icon { width: 13px; height: 13px; color: var(--muted); }
.meta-bit.overdue { color: var(--danger); }
.meta-bit.overdue .icon { color: var(--danger); }
.prio { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; }
.prio .dot { width: 7px; height: 7px; border-radius: 50%; }
.prio.high { color: var(--danger); } .prio.high .dot { background: var(--danger); }
.prio.medium { color: var(--warn); } .prio.medium .dot { background: var(--warn); }
.prio.low { color: var(--accent); } .prio.low .dot { background: var(--accent); }
.cat-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); font-weight: 500; }

/* Week view */
.week-nav { display: flex; align-items: center; gap: 8px; margin: 18px 0 4px; }
.week-nav .btn { padding: 8px 13px; }
.week-nav .btn .icon { width: 15px; height: 15px; }
.week-nav .btn[data-nav="today"] { margin-left: auto; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 14px; }
.day-col {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  min-height: 220px; display: flex; flex-direction: column; overflow: hidden;
}
.day-col.today { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line); }
.day-head { padding: 11px 12px; border-bottom: 1px solid var(--border); }
.day-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.day-num { font-size: 19px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px; }
.day-col.today .day-name, .day-col.today .day-num { color: var(--accent); }
.day-body { padding: 9px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.day-task {
  background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 7px 9px; cursor: pointer; transition: border-color .14s;
}
.day-task:hover { border-color: var(--border-2); }
.day-task.prio-high { border-left-color: var(--danger); }
.day-task.prio-medium { border-left-color: var(--warn); }
.day-task.prio-low { border-left-color: var(--accent); }
.day-task.done { opacity: .55; }
.day-task.done .dt-title { text-decoration: line-through; }
.dt-time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dt-title { font-size: 12.5px; font-weight: 550; margin-top: 1px; line-height: 1.35; word-break: break-word; }
.day-add {
  margin-top: auto; border: none; background: transparent; color: var(--muted);
  font-size: 12px; font-family: var(--font); cursor: pointer; padding: 6px;
  border-radius: 7px; display: flex; align-items: center; justify-content: center; gap: 5px;
}
.day-add:hover { background: var(--surface-2); color: var(--accent); }

/* Empty state */
.empty { text-align: center; padding: 90px 20px; color: var(--muted); }
.empty .icon { width: 34px; height: 34px; color: var(--border-2); margin: 0 auto 14px; stroke-width: 1.4; }
.empty h3 { font-size: 16px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
.empty p { font-size: 13.5px; }

/* ---------------- Modal ---------------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(33, 30, 22, .32);
  display: grid; place-items: center; padding: 20px; z-index: 50; backdrop-filter: blur(3px);
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  width: 100%; max-width: 470px; box-shadow: var(--shadow); animation: rise .16s ease;
}
@keyframes rise { from { transform: translateY(8px) scale(.99); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.task-form { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field-label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.task-form input[type=text], .task-form textarea, .task-form input[type=date], .task-form input[type=time], .task-form select {
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px;
  font-size: 14px; font-family: var(--font); background: var(--surface); color: var(--text);
  outline: none; transition: border-color .14s; width: 100%;
}
.task-form input:focus, .task-form textarea:focus, .task-form select:focus { border-color: var(--accent); }
.task-form textarea { resize: vertical; min-height: 56px; line-height: 1.45; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* segmented priority */
.seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.seg button {
  flex: 1; border: none; background: var(--surface); padding: 9px 6px; font-size: 13px;
  font-family: var(--font); font-weight: 500; color: var(--text-2); cursor: pointer;
  border-right: 1px solid var(--border); transition: background .12s, color .12s;
}
.seg button:last-child { border-right: none; }
.seg button.active { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
.switch-row .txt { font-size: 13.5px; color: var(--text); font-weight: 500; }
.switch-row .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
.switch { position: relative; width: 40px; height: 23px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: var(--border-2); border-radius: 999px; transition: background .16s; cursor: pointer; }
.slider::before { content: ""; position: absolute; width: 17px; height: 17px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .16s; box-shadow: var(--shadow-sm); }
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(17px); }

.modal-actions { display: flex; align-items: center; gap: 9px; margin-top: 4px; }
.modal-actions .spacer { flex: 1; }
#delete-task { color: var(--danger); background: transparent; border-color: transparent; padding-left: 6px; padding-right: 6px; }
#delete-task:hover { background: var(--danger-soft); }

/* ---------------- Toast ---------------- */
.toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 10px;
  font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow); z-index: 100; animation: rise .2s ease;
}
.toast[hidden] { display: none; }

/* ---------------- Responsive ---------------- */
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; bottom: 0; left: 0; right: 0; top: auto; z-index: 40;
    flex-direction: row; align-items: center; gap: 6px; padding: 8px 10px;
    border-right: none; border-top: 1px solid var(--border); overflow-x: auto;
  }
  .brand, .side-heading, .cat-list, .sidebar-spacer, .side-action { display: none; }
  .nav { flex-direction: row; gap: 4px; }
  .nav-btn { flex-direction: column; gap: 3px; font-size: 11px; padding: 6px 10px; white-space: nowrap; }
  .nav-btn .count { display: none; }
  .main { padding-bottom: 64px; }
  .topbar, .summary, .content { padding-left: 18px; padding-right: 18px; }
  .week { grid-template-columns: 1fr; }
  .search input { width: 120px; }
}

  </style>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Werkagenda</h1>
        <span class="date" id="brand-date"></span>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-view="today">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
          Vandaag <span class="count" id="count-today">0</span>
        </button>
        <button class="nav-btn" data-view="week">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
          Deze week
        </button>
        <button class="nav-btn" data-view="all">
          <svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
          Alle taken <span class="count" id="count-all">0</span>
        </button>
        <button class="nav-btn" data-view="done">
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Afgerond
        </button>
      </nav>

      <div>
        <div class="side-heading">Categorieën</div>
        <ul class="cat-list" id="cat-list"></ul>
      </div>

      <div class="sidebar-spacer"></div>

      <button class="side-action" id="notif-toggle">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span id="notif-label">Herinneringen aanzetten</span>
      </button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="view-title">Vandaag</h2>
          <div class="sub" id="view-sub"></div>
        </div>
        <div class="topbar-actions">
          <div class="search">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search" placeholder="Zoeken" />
          </div>
          <button class="btn btn-primary" id="add-task">
            <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nieuwe taak
          </button>
        </div>
      </header>

      <section class="summary" id="summary"></section>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">Nieuwe taak</h3>
        <button class="icon-btn" id="modal-close" aria-label="Sluiten">
          <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="task-form" class="task-form">
        <input type="hidden" id="task-id" />
        <div class="field">
          <label for="f-title">Titel</label>
          <input type="text" id="f-title" required placeholder="Wat moet er gebeuren?" />
        </div>
        <div class="field">
          <label for="f-notes">Notities</label>
          <textarea id="f-notes" placeholder="Extra details (optioneel)"></textarea>
        </div>
        <div class="row-2">
          <div class="field"><label for="f-date">Datum</label><input type="date" id="f-date" /></div>
          <div class="field"><label for="f-time">Tijd</label><input type="time" id="f-time" /></div>
        </div>
        <div class="field">
          <span class="field-label">Prioriteit</span>
          <div class="seg" id="prio-seg">
            <button type="button" data-p="low">Laag</button>
            <button type="button" data-p="medium">Normaal</button>
            <button type="button" data-p="high">Hoog</button>
          </div>
        </div>
        <div class="field">
          <label for="f-category">Categorie</label>
          <select id="f-category"></select>
        </div>
        <div class="switch-row">
          <div>
            <div class="txt">Herinnering</div>
            <div class="hint">Melding op het ingestelde tijdstip</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="f-reminder" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="delete-task" hidden>Verwijderen</button>
          <div class="spacer"></div>
          <button type="button" class="btn btn-ghost" id="modal-cancel">Annuleren</button>
          <button type="submit" class="btn btn-primary">Opslaan</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script>
/* ===========================================================
   Werkagenda — applicatielogica
   Data wordt lokaal in de browser opgeslagen (localStorage).
   =========================================================== */
(() => {
  "use strict";

  const STORE_KEY = "werkagenda.v2";
  const $ = (s) => document.querySelector(s);
  const qa = (s) => Array.from(document.querySelectorAll(s));

  /* ---- SVG-iconen ---- */
  const I = {
    check: '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
    clock: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>',
    bell: '<svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
    plus: '<svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    inbox: '<svg class="icon" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>',
    chevL: '<svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>',
    chevR: '<svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
  };

  const DEFAULT_CATEGORIES = [
    { id: "werk", name: "Werk", color: "#2f6a52" },
    { id: "vergadering", name: "Overleg", color: "#3a6ea5" },
    { id: "persoonlijk", name: "Persoonlijk", color: "#9a7430" },
    { id: "urgent", name: "Urgent", color: "#a8443a" },
  ];

  let state = loadState();
  let currentView = "today";
  let activeCategory = null;
  let searchTerm = "";
  let weekOffset = 0; // 0 = deze week, -1 = vorige, 1 = volgende, ...

  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        return { tasks: p.tasks || [], categories: p.categories || DEFAULT_CATEGORIES };
      }
    } catch (e) { console.warn(e); }
    return { tasks: [], categories: DEFAULT_CATEGORIES };
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* ---- datum-helpers ---- */
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayStr = () => iso(new Date());

  function dueDate(t) {
    if (!t.date) return null;
    return new Date(`${t.date}T${t.time || "23:59"}`);
  }
  const isToday = (t) => t.date === todayStr();
  function weekStart() {
    const n = new Date();
    const s = new Date(n);
    s.setDate(n.getDate() - ((n.getDay() + 6) % 7));
    s.setHours(0, 0, 0, 0);
    return s;
  }
  function displayedWeekStart() {
    const s = weekStart();
    s.setDate(s.getDate() + weekOffset * 7);
    return s;
  }
  function isThisWeek(t) {
    if (!t.date) return false;
    const d = new Date(t.date + "T00:00");
    const s = weekStart();
    const e = new Date(s); e.setDate(s.getDate() + 7);
    return d >= s && d < e;
  }
  function isOverdue(t) {
    if (t.done) return false;
    const d = dueDate(t);
    return d && d < new Date();
  }
  const WD = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
  const WD_SHORT = ["zo", "ma", "di", "wo", "do", "vr", "za"];
  function fmtDate(str) {
    if (!str) return "";
    const d = new Date(str + "T00:00");
    const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
    if (str === todayStr()) return "Vandaag";
    if (str === iso(tmr)) return "Morgen";
    return d.toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });
  }

  /* ---- render ---- */
  function render() {
    $("#brand-date").textContent = new Date().toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });
    renderCategories();
    renderCounts();
    renderSummary();
    renderMain();
  }

  const catById = (id) => state.categories.find((c) => c.id === id);

  function renderCategories() {
    const list = $("#cat-list");
    list.innerHTML = "";
    const mkLi = (label, color, active, onClick, count) => {
      const li = document.createElement("li");
      if (active) li.classList.add("active");
      li.innerHTML = `<span class="cat-dot" style="background:${color}"></span>${esc(label)}` +
        (count != null ? `<span class="cat-count">${count}</span>` : "");
      li.onclick = onClick;
      return li;
    };
    list.appendChild(mkLi("Alle categorieën", "linear-gradient(135deg,#2f6a52,#3a6ea5)", activeCategory === null, () => { activeCategory = null; render(); }, null));
    state.categories.forEach((c) => {
      const count = state.tasks.filter((t) => t.category === c.id && !t.done).length;
      list.appendChild(mkLi(c.name, c.color, activeCategory === c.id, () => { activeCategory = c.id; render(); }, count));
    });

    const sel = $("#f-category");
    sel.innerHTML = "";
    state.categories.forEach((c) => {
      const o = document.createElement("option");
      o.value = c.id; o.textContent = c.name; sel.appendChild(o);
    });
  }

  function renderCounts() {
    $("#count-today").textContent = state.tasks.filter((t) => isToday(t) && !t.done).length;
    $("#count-all").textContent = state.tasks.filter((t) => !t.done).length;
  }

  function renderSummary() {
    const open = state.tasks.filter((t) => !t.done).length;
    const overdue = state.tasks.filter((t) => isOverdue(t)).length;
    const today = state.tasks.filter((t) => isToday(t) && !t.done).length;
    const done = state.tasks.filter((t) => t.done).length;
    $("#summary").innerHTML = `
      <div class="item"><span class="num">${today}</span><span class="lbl">Vandaag</span></div>
      <div class="item"><span class="num">${open}</span><span class="lbl">Openstaand</span></div>
      <div class="item"><span class="num danger">${overdue}</span><span class="lbl">Te laat</span></div>
      <div class="item"><span class="num accent">${done}</span><span class="lbl">Afgerond</span></div>`;
  }

  const META = {
    today: ["Vandaag", () => new Date().toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" })],
    week:  ["Deze week", () => { const s = weekStart(), e = new Date(s); e.setDate(s.getDate() + 6); return `${s.getDate()} – ${e.toLocaleDateString("nl-NL", { day: "numeric", month: "long" })}`; }],
    all:   ["Alle taken", () => "Een volledig overzicht van wat openstaat"],
    done:  ["Afgerond", () => "Wat je hebt afgevinkt"],
  };

  function applyFilters(tasks) {
    let l = tasks.slice();
    if (currentView === "today") l = l.filter((t) => isToday(t) && !t.done);
    else if (currentView === "week") l = l.filter((t) => isThisWeek(t));
    else if (currentView === "all") l = l.filter((t) => !t.done);
    else if (currentView === "done") l = l.filter((t) => t.done);
    if (activeCategory) l = l.filter((t) => t.category === activeCategory);
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      l = l.filter((t) => t.title.toLowerCase().includes(q) || (t.notes || "").toLowerCase().includes(q));
    }
    return l;
  }
  function sortTasks(tasks) {
    const rank = { high: 0, medium: 1, low: 2 };
    return tasks.sort((a, b) => {
      const da = dueDate(a), db = dueDate(b);
      if (da && db && +da !== +db) return da - db;
      if (da && !db) return -1;
      if (db && !da) return 1;
      return rank[a.priority] - rank[b.priority];
    });
  }

  function renderMain() {
    const [title, subFn] = META[currentView];
    $("#view-title").textContent = title;
    $("#view-sub").textContent = subFn();
    const c = $("#content");
    c.innerHTML = "";
    if (currentView === "week") { renderWeek(c); return; }

    const tasks = sortTasks(applyFilters(state.tasks));
    if (!tasks.length) { c.appendChild(emptyState()); return; }

    if (currentView === "all") {
      const groups = {};
      tasks.forEach((t) => { const k = t.date || "_"; (groups[k] = groups[k] || []).push(t); });
      Object.keys(groups).sort((a, b) => (a === "_" ? 1 : b === "_" ? -1 : a.localeCompare(b))).forEach((k) => {
        const h = document.createElement("div");
        h.className = "group-title";
        h.textContent = k === "_" ? "Zonder datum" : fmtDate(k);
        c.appendChild(h);
        groups[k].forEach((t) => c.appendChild(taskRow(t)));
      });
    } else {
      tasks.forEach((t) => c.appendChild(taskRow(t)));
    }
  }

  function emptyState() {
    const d = document.createElement("div");
    d.className = "empty";
    d.innerHTML = `${I.inbox}<h3>${currentView === "done" ? "Nog niets afgerond" : "Niets gepland"}</h3>
      <p>${currentView === "done" ? "Afgevinkte taken verschijnen hier." : "Voeg een taak toe met de knop rechtsboven."}</p>`;
    return d;
  }

  function taskRow(t) {
    const el = document.createElement("div");
    el.className = "task" + (t.done ? " done" : "");
    const cat = catById(t.category);
    const bits = [];
    if (t.date || t.time) {
      const od = isOverdue(t);
      const label = `${t.date ? fmtDateShort(t.date) : ""}${t.time ? (t.date ? " · " : "") + t.time : ""}`;
      bits.push(`<span class="meta-bit${od ? " overdue" : ""}">${I.clock}${esc(label)}</span>`);
    }
    const prioLabel = { high: "Hoog", medium: "Normaal", low: "Laag" }[t.priority];
    bits.push(`<span class="prio ${t.priority}"><span class="dot"></span>${prioLabel}</span>`);
    if (cat) bits.push(`<span class="cat-tag"><span class="cat-dot" style="background:${cat.color}"></span>${esc(cat.name)}</span>`);
    if (t.reminder && !t.done) bits.push(`<span class="meta-bit">${I.bell}Herinnering</span>`);

    el.innerHTML = `
      <div class="check${t.done ? " checked" : ""}">${t.done ? I.check : ""}</div>
      <div class="task-body">
        <div class="task-title">${esc(t.title)}</div>
        ${t.notes ? `<div class="task-notes">${esc(t.notes)}</div>` : ""}
        <div class="task-meta">${bits.join("")}</div>
      </div>`;
    el.querySelector(".check").addEventListener("click", (e) => { e.stopPropagation(); toggleDone(t.id); });
    el.addEventListener("click", () => openModal(t));
    return el;
  }

  function fmtDateShort(str) {
    const d = new Date(str + "T00:00");
    const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
    if (str === todayStr()) return "Vandaag";
    if (str === iso(tmr)) return "Morgen";
    return d.toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" });
  }

  function renderWeek(c) {
    const s = displayedWeekStart();
    const e = new Date(s); e.setDate(s.getDate() + 6);

    // Titel + ondertitel laten meebewegen met de getoonde week
    const relLabel = { "0": "Deze week", "-1": "Vorige week", "1": "Volgende week" };
    $("#view-title").textContent = relLabel[String(weekOffset)] ||
      (weekOffset > 0 ? `Over ${weekOffset} weken` : `${Math.abs(weekOffset)} weken geleden`);
    $("#view-sub").textContent =
      `${s.toLocaleDateString("nl-NL", { day: "numeric", month: "long" })} – ${e.toLocaleDateString("nl-NL", { day: "numeric", month: "long" })}`;

    // Navigatiebalk: vorige / vandaag / volgende
    const nav = document.createElement("div");
    nav.className = "week-nav";
    nav.innerHTML =
      `<button class="btn btn-ghost" data-nav="prev">${I.chevL} Vorige week</button>` +
      `<button class="btn btn-ghost" data-nav="next">Volgende week ${I.chevR}</button>` +
      (weekOffset !== 0 ? `<button class="btn btn-ghost" data-nav="today">Naar deze week</button>` : "");
    nav.addEventListener("click", (ev) => {
      const b = ev.target.closest("button"); if (!b) return;
      if (b.dataset.nav === "prev") weekOffset--;
      else if (b.dataset.nav === "next") weekOffset++;
      else weekOffset = 0;
      renderMain();
    });
    c.appendChild(nav);

    const grid = document.createElement("div");
    grid.className = "week";
    for (let i = 0; i < 7; i++) {
      const day = new Date(s); day.setDate(s.getDate() + i);
      const key = iso(day);
      const col = document.createElement("div");
      col.className = "day-col" + (key === todayStr() ? " today" : "");
      let dayTasks = state.tasks.filter((t) => t.date === key);
      if (activeCategory) dayTasks = dayTasks.filter((t) => t.category === activeCategory);
      dayTasks = sortTasks(dayTasks);
      col.innerHTML = `<div class="day-head"><div class="day-name">${WD_SHORT[day.getDay()]}</div><div class="day-num">${day.getDate()}</div></div>`;
      const body = document.createElement("div");
      body.className = "day-body";
      dayTasks.forEach((t) => {
        const dt = document.createElement("div");
        dt.className = `day-task prio-${t.priority}` + (t.done ? " done" : "");
        dt.innerHTML = `${t.time ? `<div class="dt-time">${esc(t.time)}</div>` : ""}<div class="dt-title">${esc(t.title)}</div>`;
        dt.addEventListener("click", () => openModal(t));
        body.appendChild(dt);
      });
      const add = document.createElement("button");
      add.className = "day-add";
      add.innerHTML = `${I.plus}`;
      add.title = "Taak op deze dag";
      add.addEventListener("click", () => openModal(null, key));
      body.appendChild(add);
      col.appendChild(body);
      grid.appendChild(col);
    }
    c.appendChild(grid);
  }

  /* ---- acties ---- */
  function toggleDone(id) {
    const t = state.tasks.find((x) => x.id === id);
    if (!t) return;
    t.done = !t.done;
    if (t.done) { t.notified = true; toast("Taak afgerond"); }
    save(); render();
  }
  function deleteTask(id) {
    state.tasks = state.tasks.filter((x) => x.id !== id);
    save(); render(); toast("Taak verwijderd");
  }

  /* ---- modal ---- */
  const backdrop = $("#modal-backdrop");
  let formPriority = "medium";

  function setPriority(p) {
    formPriority = p;
    qa("#prio-seg button").forEach((b) => b.classList.toggle("active", b.dataset.p === p));
  }

  function openModal(task = null, presetDate = null) {
    $("#modal-title").textContent = task ? "Taak bewerken" : "Nieuwe taak";
    $("#task-id").value = task ? task.id : "";
    $("#f-title").value = task ? task.title : "";
    $("#f-notes").value = task ? task.notes || "" : "";
    $("#f-date").value = task ? task.date || "" : (presetDate || todayStr());
    $("#f-time").value = task ? task.time || "" : "";
    setPriority(task ? task.priority : "medium");
    $("#f-category").value = task ? (task.category || state.categories[0].id) : state.categories[0].id;
    $("#f-reminder").checked = task ? !!task.reminder : false;
    $("#delete-task").hidden = !task;
    backdrop.hidden = false;
    setTimeout(() => $("#f-title").focus(), 40);
  }
  const closeModal = () => { backdrop.hidden = true; };

  $("#task-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const id = $("#task-id").value;
    const data = {
      title: $("#f-title").value.trim(),
      notes: $("#f-notes").value.trim(),
      date: $("#f-date").value,
      time: $("#f-time").value,
      priority: formPriority,
      category: $("#f-category").value,
      reminder: $("#f-reminder").checked,
    };
    if (!data.title) return;
    if (id) {
      const t = state.tasks.find((x) => x.id === id);
      Object.assign(t, data); t.notified = false;
      toast("Taak bijgewerkt");
    } else {
      state.tasks.push({ id: uid(), done: false, notified: false, created: Date.now(), ...data });
      toast("Taak toegevoegd");
    }
    save(); render(); closeModal();
  });

  $("#prio-seg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (b) setPriority(b.dataset.p);
  });
  $("#delete-task").addEventListener("click", () => {
    const id = $("#task-id").value;
    if (id && confirm("Deze taak verwijderen?")) { deleteTask(id); closeModal(); }
  });
  $("#modal-close").addEventListener("click", closeModal);
  $("#modal-cancel").addEventListener("click", closeModal);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); });
  $("#add-task").addEventListener("click", () => openModal());

  /* ---- navigatie / zoeken ---- */
  qa(".nav-btn").forEach((b) => b.addEventListener("click", () => {
    qa(".nav-btn").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    currentView = b.dataset.view;
    weekOffset = 0;
    render();
  }));
  $("#search").addEventListener("input", (e) => { searchTerm = e.target.value; renderMain(); });

  /* ---- herinneringen ---- */
  const notifBtn = $("#notif-toggle");
  function syncNotifBtn() {
    const granted = "Notification" in window && Notification.permission === "granted";
    notifBtn.classList.toggle("on", granted);
    $("#notif-label").textContent = granted ? "Herinneringen aan" : "Herinneringen aanzetten";
  }
  notifBtn.addEventListener("click", async () => {
    if (!("Notification" in window)) { toast("Meldingen niet ondersteund in deze browser"); return; }
    if (Notification.permission === "granted") { toast("Herinneringen staan al aan"); return; }
    const p = await Notification.requestPermission();
    syncNotifBtn();
    toast(p === "granted" ? "Herinneringen ingeschakeld" : "Meldingen geweigerd");
  });
  function notify(title, body) {
    if ("Notification" in window && Notification.permission === "granted") new Notification(title, { body });
  }
  function checkReminders() {
    const now = new Date();
    let changed = false;
    state.tasks.forEach((t) => {
      if (t.reminder && !t.done && !t.notified) {
        const d = dueDate(t);
        if (d && d <= now) { notify("Herinnering: " + t.title, t.notes || "Deze taak staat gepland."); t.notified = true; changed = true; }
      }
    });
    if (changed) save();
  }
  setInterval(checkReminders, 30000);

  /* ---- overig ---- */
  let toastT;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 2400);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !backdrop.hidden) closeModal();
    if ((e.key === "n" || e.key === "N") && backdrop.hidden &&
        !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
      e.preventDefault(); openModal();
    }
  });

  /* ---- init ---- */
  syncNotifBtn();
  render();
  checkReminders();
})();

  </script>
</body>
</html>
